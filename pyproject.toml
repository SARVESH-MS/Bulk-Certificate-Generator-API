[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-certificate-generator-api"
version = "1.0.0"
description = "High-performance REST API for bulk certificate generation with async processing, fault isolation, and vector PDF rendering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Engineering Candidate" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "reportlab>=4.2.5",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
]


[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
